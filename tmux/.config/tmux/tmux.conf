# -- General settings --

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm*:Tc"

# undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm' # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m' # underscore colours - needs tmux-3.0

# check if we are in wsl
if-shell 'test -n "$WSL_DISTRO_NAME"' {
   set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m' # underscore colours - needs tmux-3.0 (wsl2 in Windows Terminal)
}

set -s escape-time 0
set -g mouse on
set -g status-position top
set -g base-index 1
set -g history-limit 50000
set -g display-time 3000
set -g status-interval 5
set -g renumber-windows on
set -g focus-events on
setw -g mode-keys vi

unbind C-b
set -g prefix C-s
bind -N "Send prefix" C-s send-prefix

# Key bindings
bind -N "Reload configuration file" R \
   source-file ~/.config/tmux/tmux.conf \; \
   display-message "Config file reloaded!"

# Basic bindings
bind -N "Rename window"                     r command-prompt "rename-window %%"
bind -N "Split horizontally with same path" s split-window -v -c "#{pane_current_path}"
bind -N "Split vertically with same path"   v split-window -h -c "#{pane_current_path}"
bind -N "Create new window with same path"  c new-window -c "#{pane_current_path}"
bind -N "Pick session"                      S choose-tree

unbind x
bind -N "Kill current pane" q kill-pane

# Easier and faster switching between next/prev window
bind -N "Previous window" -r C-h previous-window
bind -N "Next window"     -r C-l next-window

# vim-like pane switching
bind -N "Last window" -r a last-window
bind -N "Move up"     -r k select-pane -U
bind -N "Move down"   -r j select-pane -D
bind -N "Move left"   -r h select-pane -L
bind -N "Move right"  -r l select-pane -R

# Custom scripts

# Popups
bind t display-popup \
  -T "Terminal" \
  -d "#{pane_current_path}" \
  -E "zsh"

bind g display-popup \
  -h 10 \
  -w 60 \
  -T "Search the Internet" \
  -E "~/.local/bin/the-googler.sh"

bind C-c display-popup \
  -h 70% \
  -w 70% \
  -T "Le ~Quick~ Chat" \
  -E "~/.local/bin/quick-chat-v2.sh"

# List of plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$XDG_DATA_HOME/tmux/plugins"
set -g @plugin 'tmux-plugins/tpm'

# Tokyonight theme
set -g @tokyo-night-tmux_window_id_style none
set -g @tokyo-night-tmux_show_wbg 0
set -g @tokyo-night-tmux_show_git 1
set -g @plugin "janoamaral/tokyo-night-tmux"

# Custom theme
# run ~/.config/tmux/theme/theme.tmux

# Automatically install tpm
if "test ! -d $XDG_DATA_HOME/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm $XDG_DATA_HOME/tmux/plugins/tpm && $XDG_DATA_HOME/tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run "$XDG_DATA_HOME/tmux/plugins/tpm/tpm"
